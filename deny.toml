# Issuerd dependency audit configuration
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Advisory checks ---
[advisories]
yanked = "deny"
# Ignore specific advisories by ID if needed:
ignore = [
    # rustls-pemfile is unmaintained but still a transitive dependency of redis
    # and rustls-native-certs. We migrated our direct usage to rustls-pki-types.
    { id = "RUSTSEC-2025-0134", reason = "transitive dep via redis/rustls-native-certs; direct usage migrated to rustls-pki-types" },
    # rsa crate: timing side-channel in RSA PRIVATE-KEY operations (Marvin Attack,
    # CVE-2023-49092) — that means decryption AND PKCS#1 v1.5 signing; signature
    # verification is a public-key operation and is unaffected. Issuerd never decrypts
    # RSA, but RS256/384/512 JWT signing DOES run through the rsa crate: jsonwebtoken's
    # `rust_crypto` backend (workspace Cargo.toml) implements RSA signing with
    # rsa::SigningKey, and ring is only used for Ed25519 key generation. Every fresh
    # install persists an active RS256 key (OIDC Core §15.1 requires advertising it) and
    # realms pinned via the `default_signature_algorithm` attribute sign every token
    # through this path, so the network-observable timing surface the advisory describes
    # is reachable in supported configurations. Accepted residual risk (NOT
    # non-applicable): no patched rsa release exists (still open against 0.9.10; upstream
    # RustCrypto/RSA#626/#680/#702), the sign path applies RNG blinding, the classic
    # Marvin decryption oracle does not exist here, and new deployments default to EdDSA
    # so RS256 signing is an explicit per-realm opt-in.
    # Residual plan: migrate RSA key generation off the rsa crate (openssl is already an
    # in-tree dependency) and evaluate jsonwebtoken's aws_lc_rs backend; drop this ignore
    # once rsa leaves the tree entirely.
    { id = "RUSTSEC-2023-0071", reason = "Marvin affects RSA private-key ops incl. PKCS#1 v1.5 signing; RS256/384/512 JWT signing runs through the rsa crate (jsonwebtoken rust_crypto backend) — accepted residual risk: no patched release, RNG-blinded sign path, no RSA decryption anywhere, EdDSA default (RS256 per-realm opt-in)" },
]

# --- License checks ---
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.8

# ring uses a custom OpenSSL-style license
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The flux-rs workspace crates (scripts/flux.sh annotation shim) ship no
# license field in their manifests; the repository root LICENSE is MIT.
# https://github.com/flux-rs/flux/blob/main/LICENSE
[[licenses.clarify]]
crate = "flux-rs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs-impl"
expression = "MIT"
license-files = []

# --- Ban checks ---
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# --- Source checks ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# flux-rs: Flux refinement-annotation proc-macro shim (scripts/flux.sh);
# not published on crates.io. Commit pinned in Cargo.lock.
allow-git = ["https://github.com/flux-rs/flux"]

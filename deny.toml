# Issuerd dependency audit configuration
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Advisory checks ---
[advisories]
yanked = "deny"
# - RUSTSEC-2023-0071 (rsa/Marvin) — resolved for real: jsonwebtoken uses the
#   aws_lc_rs backend and RSA key generation uses OpenSSL, so rsa was never
#   compiled; the sqlx 0.9 upgrade removed the last lockfile trace (its
#   sqlx-mysql rsa dependency moved behind the off-by-default `mysql-rsa`
#   feature, so cargo no longer records the inactivated weak edge). The crate
#   is in neither the lockfile nor the build graph.
# - RUSTSEC-2025-0134 (rustls-pemfile unmaintained) — resolved by the redis
#   0.29 upgrade (rustls-native-certs 0.8 moved to rustls-pki-types); the
#   crate is out of the lockfile entirely.
# - RUSTSEC-2024-0449 (unsafe-libyaml unmaintained) — resolved by migrating
#   config/provision YAML parsing from serde_yaml to serde-saphyr
#   (pure-Rust granit-parser backend, `#![deny(unsafe_code)]`); serde_yaml and
#   unsafe-libyaml are out of the lockfile entirely.
# - RUSTSEC-2026-0367 / -0368 / -0369 (zip extraction) — resolved by the
#   utoipa 6.0 / utoipa-swagger-ui 10.0.2 upgrade, which builds with zip ^9.0
#   (>= 9.0.0 is the patched line). zip was only ever a build dependency of
#   utoipa-swagger-ui's `vendored` feature, never linked into the daemon.
# The ignore list is empty and must stay that way.
ignore = []

# --- License checks ---
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.8

# ring uses a custom OpenSSL-style license
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The flux-rs workspace crates (scripts/flux.sh annotation shim) ship no
# license field in their manifests; the repository root LICENSE is MIT.
# https://github.com/flux-rs/flux/blob/main/LICENSE
[[licenses.clarify]]
crate = "flux-rs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs-impl"
expression = "MIT"
license-files = []

# --- Ban checks ---
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# --- Source checks ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# flux-rs: Flux refinement-annotation proc-macro shim (scripts/flux.sh);
# not published on crates.io. Commit pinned in Cargo.lock.
allow-git = ["https://github.com/flux-rs/flux"]

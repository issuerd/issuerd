# Issuerd dependency audit configuration
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Advisory checks ---
[advisories]
yanked = "deny"
# No advisory ignores: the feature-resolved dependency graph is clean.
# - RUSTSEC-2023-0071 (rsa/Marvin) — resolved by removing the rsa crate from
#   the compiled graph: jsonwebtoken uses the aws_lc_rs backend, RSA key
#   generation uses OpenSSL (see workspace Cargo.toml). rsa lingers in
#   Cargo.lock only as an inactivated weak optional edge of sqlx
#   (cargo#10801) — never compiled; .cargo/audit.toml carries a scoped
#   tooling-gap ignore for cargo-audit's feature-blind lockfile scan.
# - RUSTSEC-2025-0134 (rustls-pemfile unmaintained) — resolved by the redis
#   0.29 upgrade (rustls-native-certs 0.8 moved to rustls-pki-types); the
#   crate is out of the lockfile entirely.
ignore = []

# --- License checks ---
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.8

# ring uses a custom OpenSSL-style license
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The flux-rs workspace crates (scripts/flux.sh annotation shim) ship no
# license field in their manifests; the repository root LICENSE is MIT.
# https://github.com/flux-rs/flux/blob/main/LICENSE
[[licenses.clarify]]
crate = "flux-rs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "flux-attrs-impl"
expression = "MIT"
license-files = []

# --- Ban checks ---
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# --- Source checks ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# flux-rs: Flux refinement-annotation proc-macro shim (scripts/flux.sh);
# not published on crates.io. Commit pinned in Cargo.lock.
allow-git = ["https://github.com/flux-rs/flux"]

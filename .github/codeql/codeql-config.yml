name: "issuerd CodeQL config"

# Referenced from the ADVANCED setup workflow `.github/workflows/codeql.yml`
# via `config-file`. (Previously merged into the default setup via the
# org-level repository property `github-codeql-config-file`; the default setup
# was retired on 2026-10-10 because its runs were never created for
# approval-gated fork PRs, while the `main` ruleset requires CodeQL results
# at merge.)
#
# Test code is full of intentional fixture secrets (Password123!, TOTP seeds,
# mock keys, loopback harness traffic) that flooded the queue with ~520
# hard-coded-cryptographic-value / cleartext-* false positives (bulk-dismissed
# 2026-09-25). Exclude the test trees so the signal stays usable. Production
# code — crates/, src/, webclientsrc/src and webclientsrc/public (login.html
# is served by the IdP origin) — keeps full coverage.
#
# Note: inline #[cfg(test)] modules inside crates/.../src/*.rs cannot be
# path-excluded (they share a file with production code); occasional fixture
# alerts there are dismissed as "used in tests".
paths-ignore:
  - tests/**
  - webclientsrc/src/test/**
  - '**/*.test.ts'
  - '**/*.test.tsx'

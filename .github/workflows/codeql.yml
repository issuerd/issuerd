name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "42 3 * * 6" # weekly, replaces the default setup's schedule

# Cancel superseded runs on the same ref (rapid pushes, PR updates).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      # SARIF upload; on fork PRs GitHub grants this to code scanning for
      # public repos.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Rust extraction is buildless; the interpreted languages need no
          # build either.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

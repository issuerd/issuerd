name: Release

# Tag push (v*) → GitHub Release with Linux amd64/arm64 + Windows binary
# archives (SBOMs + checksums), the multi-arch issuerd/issuerd image on Docker
# Hub, and a crates.io publish of the whole workspace. The tag must match
# [workspace.package] version in Cargo.toml and have a dated CHANGELOG.md
# section — the validate job fails fast otherwise.
#
# Heavy suites: the tag run also executes heavy.yml (federation, cluster E2E,
# Keycloak parity, OIDF conformance) as a reusable-workflow call — the final
# verification of the exact released commit. The GitHub Release job waits for
# it and attaches the packed conformance evidence bundle as a standalone
# release asset (not inside the binary distros — one copy alongside the
# SBOMs).
#
# Publishing is the FINAL stage of the pipeline — nothing is published until
# every verification has passed: the crates-io, docker, and docker-arm64 jobs
# ALL need the release job (which gates on the heavy suites + every platform
# build/test job), so a tag with failing tests never publishes crates or
# images. The publish jobs run side by side after the gate; a late failure in
# any of them is recovered by a job-level re-run of the same release run
# (crates.io uploads are resumable — scripts/publish.py skips
# already-uploaded crates, --from CRATE resumes mid-list).
#
# Multi-arch Docker: the docker / docker-arm64 jobs push per-arch images
# (issuerd/issuerd:X.Y.Z-amd64, …-arm64), then docker-manifest assembles the
# user-facing manifest list (:latest, :X.Y.Z, :X.Y) — one tag serving both
# architectures (docker pull picks the host arch). Per-arch tags carry no
# embedded SBOM/provenance attestations on purpose: attested pushes make each
# tag an OCI index, and nesting indexes breaks manifest-list merging.
# The arm64 image is packed from the natively built binary (ubuntu-22.04-arm
# runner — see the linux-arm64 job and Dockerfile.prebuilt).
#
# Local rehearsal: .act/run-release.sh runs this workflow under nektos/act
# (plus .act/rehearse-arm64.sh / rehearse-manifest.sh for the arm64 and
# manifest mechanics). act sets ACT=true; every step that touches an external
# service (Docker Hub login/push, manifest push, Hub overview PATCH, crates.io
# upload, release creation, attestations) is gated on `env.ACT != 'true'` so
# the rehearsal exercises everything except the actual publishing.

on:
  push:
    tags: ['v*']

# Never cancel a release run mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate tag ↔ version ↔ changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Tag must match workspace version and CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -A10 '^\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | cut -d'"' -f2)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${cargo_version} — bump Cargo.toml or re-tag."
            exit 1
          fi
          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          start=$(grep -nF "## [$VERSION] - " CHANGELOG.md | head -1 | cut -d: -f1)
          # Section body up to the next '## [' heading, leading blank lines dropped.
          tail -n +"$((start + 1))" CHANGELOG.md | awk '/^## \[/{exit} {print}' | awk 'NF{p=1} p' > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<EOF

          ---

          ### Archives

          - \`issuerd_${VERSION}_linux_amd64.tar.gz\` — Linux x86_64 (requires glibc ≥ 2.35, OpenSSL 3, Kerberos libs; Debian/Ubuntu: \`apt install libssl3 libgssapi-krb5-2\`)
          - \`issuerd_${VERSION}_linux_arm64.tar.gz\` — Linux arm64/aarch64, built natively (ubuntu-22.04-arm runner) on the same baseline (glibc ≥ 2.35, OpenSSL 3, Kerberos libs)
          - \`issuerd_${VERSION}_windows_amd64.zip\` — Windows x86_64 (self-contained)
          - \`issuerd_${VERSION}_macos_arm64.tar.gz\` — macOS Apple Silicon (arm64), natively built (macos-15 runner, deployment target macOS 11.0)
          - \`issuerd_${VERSION}_conformance-evidence.tar.gz\` — OIDF conformance suite evidence from this tag's run (HTML reports, JSON exports, runner logs; informational — not needed to run issuerd)

          Each archive contains the binary, LICENSE + NOTICE, README + CHANGELOG, example configs, and a CycloneDX SBOM (also attached standalone). Verify downloads against \`SHA256SUMS.txt\`.

          ### Docker (multi-arch: linux/amd64 + linux/arm64)

          \`\`\`
          docker pull issuerd/issuerd:${VERSION}   # pinned — resolves to your host architecture
          docker pull issuerd/issuerd:latest       # latest release
          \`\`\`

          Per-architecture tags are also published: \`issuerd/issuerd:${VERSION}-amd64\` and \`issuerd/issuerd:${VERSION}-arm64\`.

          ### crates.io

          All workspace crates are published at ${VERSION} — \`cargo install issuerd --version ${VERSION}\` or \`issuerd = "${VERSION}"\` as a dependency.
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  heavy:
    name: heavy suites (federation, cluster E2E, parity, conformance)
    needs: validate
    # Reusable-workflow call — the heavy jobs run inside THIS run, so the
    # conformance-evidence artifact is downloadable by the release job below.
    # Skipped under act (rehearsing hours of Docker suites locally is
    # pointless); the release job tolerates that skip via its `if`. Gate uses
    # vars.ACT — job-level `if` has NO `env` context (GitHub rejects it, as
    # does act), so .act/run-release.sh passes `--var ACT=true` instead of
    # relying on act's automatic ACT env var.
    if: ${{ vars.ACT != 'true' }}
    uses: ./.github/workflows/heavy.yml

  docker:
    name: docker image (linux/amd64) → Docker Hub
    # FINAL stage: needs the heavy suites + all platform builds (via the
    # release job's gate) — a tag with failing tests never reaches Docker
    # Hub. Runs side by side with the crates-io publish after the gate.
    needs: [validate, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Per-arch tag only; the docker-manifest job merges both arches into the
      # user-facing tags. No sbom/provenance here: attested pushes turn the tag
      # into an OCI index, which cannot be nested into the final manifest list.
      - name: Image tags and labels
        id: meta
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          echo "issuerd/issuerd:$VERSION-amd64" | tee tags.txt
          {
            echo "tags<<EOF"; cat tags.txt; echo "EOF"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: ${{ env.ACT != 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Under act: build + load locally only (no push).
      - uses: docker/build-push-action@v7
        env:
          # No .dockerbuild build-record artifact — download-artifact cannot
          # fetch those, and the release job downloads artifacts by pattern.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.ACT != 'true' }}
          load: ${{ env.ACT == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=issuerd
            org.opencontainers.image.description=Horizontally scalable, modular OIDC/OAuth2 IAM server (Keycloak-inspired)
            org.opencontainers.image.source=https://github.com/issuerd/issuerd
            org.opencontainers.image.url=https://github.com/issuerd/issuerd
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          sbom: false
          provenance: false
          cache-from: type=gha
          cache-to: ${{ env.ACT != 'true' && 'type=gha,mode=max' || '' }}

  linux-binary:
    name: linux amd64 binary
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The tarball ships the exact binary the Docker image ships: build the
      # canonical root Dockerfile and copy the binary out of it.
      - name: Build the canonical image and extract the binary
        run: |
          set -euo pipefail
          docker build -t issuerd:release-src .
          cid=$(docker create issuerd:release-src)
          docker cp "$cid:/usr/local/bin/issuerd" ./issuerd
          docker rm "$cid"
          ./issuerd --version
      - name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" syft
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syft" version
      - name: Package the archive
        run: bash scripts/package-release.sh linux "${{ needs.validate.outputs.version }}" ./issuerd ./dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: dist/
          if-no-files-found: error

  linux-arm64:
    name: linux arm64 binary (native build + unit tests)
    needs: validate
    # ubuntu-22.04-arm: native aarch64 GitHub runner on the same glibc 2.35 /
    # OpenSSL 3.0 baseline as the canonical amd64 build, so the release-notes
    # requirements hold for both. Native means no dpkg-multiarch sysroot and
    # no QEMU: the unit suite actually runs (instrumented, with coverage) and
    # the smoke run is a real execution. (The x86_64 cross route survives as
    # scripts/cross-linux-arm64.sh for local/rehearsal builds.)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs).
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0   # pinned, same as the canonical Dockerfile
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-auditable
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Native arch — plain apt, no multiarch/ports.ubuntu.com setup.
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      # Unit tests on the real target architecture, instrumented; the lcov
      # export is kept as an artifact. --lib keeps this Docker-free: the
      # Docker-dependent suites live in the integration targets.
      - name: Unit tests + coverage
        run: cargo llvm-cov --locked --workspace --lib --lcov --output-path arm64-lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-coverage
          path: arm64-lcov.info
          if-no-files-found: error
      # cargo-auditable embeds the dependency tree (same as the Dockerfile).
      - name: Build the release binary
        run: cargo auditable build --locked --release --bin issuerd
      - name: Smoke-run the binary (native — no QEMU)
        run: ./target/release/issuerd --version
      # Stage the Dockerfile.prebuilt context: binary + the Kerberos/GSS-API
      # runtime libs it links (distroless/cc supplies glibc + libssl3 +
      # ca-certificates).
      - name: Stage the arm64 image build context
        run: |
          set -euo pipefail
          mkdir -p build/arm64/rootfs/usr/lib/aarch64-linux-gnu
          cp target/release/issuerd build/arm64/issuerd
          for lib in libgssapi_krb5.so.2 libkrb5.so.3 libk5crypto.so.3 libcom_err.so.2 libkrb5support.so.0 libkeyutils.so.1; do
            cp -L "/usr/lib/aarch64-linux-gnu/$lib"* build/arm64/rootfs/usr/lib/aarch64-linux-gnu/
          done
      - name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_arm64.tar.gz | tar -xz -C "$HOME/.local/bin" syft
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syft" version
      - name: Package the archive
        run: bash scripts/package-release.sh linux-arm64 "${{ needs.validate.outputs.version }}" ./build/arm64/issuerd ./dist-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-dist
          path: dist-arm64/
          if-no-files-found: error
      # The docker-arm64 job repacks this exact binary (plus its arm64
      # Kerberos libs) into the runtime image via Dockerfile.prebuilt.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-imagectx
          path: build/arm64/
          if-no-files-found: error

  docker-arm64:
    name: docker image (linux/arm64) → Docker Hub
    # FINAL stage like the amd64 job (same gate), plus the linux-arm64 job
    # for the staged image build context artifact.
    needs: [validate, release, linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64-imagectx
          path: image-arm64
      # COPY-only build (binary + libs staged in the context): no arm64 code
      # executes on the x86_64 runner, so no QEMU is needed.
      - name: Stage the Dockerfile into the build context
        run: cp Dockerfile.prebuilt image-arm64/Dockerfile
      - name: Image tag
        id: meta
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: echo "tags=issuerd/issuerd:$VERSION-arm64" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: ${{ env.ACT != 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          # No .dockerbuild build-record artifact (see the amd64 job).
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: image-arm64
          platforms: linux/arm64
          push: ${{ env.ACT != 'true' }}
          load: ${{ env.ACT == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=issuerd
            org.opencontainers.image.description=Horizontally scalable, modular OIDC/OAuth2 IAM server (Keycloak-inspired)
            org.opencontainers.image.source=https://github.com/issuerd/issuerd
            org.opencontainers.image.url=https://github.com/issuerd/issuerd
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: false
          provenance: false

  docker-manifest:
    name: multi-arch manifest (:latest, :X.Y.Z, :X.Y)
    needs: [validate, docker, docker-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ env.ACT != 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # One manifest list per user-facing tag → both architectures under a
      # single tag; the per-arch tags stay published for pinning.
      - name: Create and push the multi-arch manifest list
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cmd=(docker buildx imagetools create
            -t "issuerd/issuerd:latest"
            -t "issuerd/issuerd:$VERSION"
            -t "issuerd/issuerd:${VERSION%.*}"
            "issuerd/issuerd:$VERSION-amd64" "issuerd/issuerd:$VERSION-arm64")
          if [ "${ACT:-}" = true ]; then
            echo "::notice::act rehearsal — would run: ${cmd[*]}"
            exit 0
          fi
          "${cmd[@]}"
          docker buildx imagetools inspect "issuerd/issuerd:$VERSION"

  dockerhub-overview:
    name: Docker Hub repo overview
    needs: [validate, docker-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Syncs the Hub repo page (Repository overview) from the committed
      # .github/dockerhub-overview.md — pushed images don't auto-sync a
      # README, so the page stays empty without this. Hub API (verified live
      # 2026-09-26): POST /v2/auth/token with identifier/secret yields a
      # Bearer token (the legacy /v2/users/token endpoint is dead, 405), then
      # PATCH the repository. The PAT must have the "Read, Write, Delete"
      # permission: metadata edits need the repo:admin scope — plain
      # "Read & Write" (repo:write) gets a 403 "insufficient scope".
      # Isolated like the other publish jobs: nothing needs it, so a Hub API
      # hiccup never blocks the GitHub Release.
      - name: PATCH the repository overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${ACT:-}" = true ]; then
            echo "::notice::act rehearsal — would PATCH hub.docker.com/v2/repositories/issuerd/issuerd/ with .github/dockerhub-overview.md"
            exit 0
          fi
          token=$(curl -sSf -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"$DOCKERHUB_USERNAME\",\"secret\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/auth/token | jq -r .access_token)
          jq -n --arg desc "$(cat .github/dockerhub-overview.md)" '{full_description: $desc}' \
            | curl -sSf -X PATCH \
                -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
                --data @- https://hub.docker.com/v2/repositories/issuerd/issuerd/ \
            | jq '{name, description, last_updated}'

  crates-io:
    name: crates.io publish (workspace)
    # FINAL stage, side by side with the Docker Hub jobs: needs the release
    # job's gate (heavy suites + every platform build/test job), so a tag
    # with failing tests never publishes crates. A late crates.io failure
    # blocks nothing else, and the publish is resumable (scripts/publish.py
    # skips already-uploaded crates; --from CRATE resumes mid-list).
    needs: [validate, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # scripts/publish.py stages webclientsrc/dist into issuerd-server, so a
      # crates.io build of the packaged crate embeds the SPA.
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo publish verify-builds each staged crate; issuerd-federation's
      # libgssapi-sys build script needs the MIT Kerberos dev package.
      - name: Install Kerberos dev libraries (libgssapi-sys)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libkrb5-dev
      - name: Publish the workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${ACT:-}" = true ]; then
            python3 scripts/publish.py            # rehearsal: stage + dry-run
          else
            python3 scripts/publish.py --real
          fi

  windows-binary:
    name: windows amd64 binary
    needs: validate
    # Every step is gated on env.ACT != 'true': act cannot run Windows jobs on
    # this host (no Windows containers), so the same steps are rehearsed
    # natively instead (see .act/run-release.sh).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v7
      - if: ${{ env.ACT != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs).
      - if: ${{ env.ACT != 'true' }}
        name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      # Vendored openssl (WebAuthn) needs a native perl on PATH; the committed
      # .cargo/config.toml points at a dev-host path, so override via env.
      - if: ${{ env.ACT != 'true' }}
        name: Strawberry Perl (vendored openssl build)
        run: choco install strawberryperl --no-progress -y
      - if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ env.ACT != 'true' }}
        uses: Swatinem/rust-cache@v2
      # cargo-auditable embeds the dependency tree in the binary (same as the
      # Dockerfile) so the SBOM scan sees every crate.
      - if: ${{ env.ACT != 'true' }}
        uses: taiki-e/install-action@cargo-auditable
      - if: ${{ env.ACT != 'true' }}
        name: Build the release binary
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: cargo auditable build --locked --release --bin issuerd
      - if: ${{ env.ACT != 'true' }}
        name: Smoke-run the binary
        run: ./target/release/issuerd.exe --version
      - if: ${{ env.ACT != 'true' }}
        name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o syft.zip https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_windows_amd64.zip
          powershell.exe -NoProfile -Command "Expand-Archive -Force -LiteralPath '$(cygpath -w syft.zip)' -DestinationPath '$(cygpath -w "$HOME/bin")'"
          rm syft.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - if: ${{ env.ACT != 'true' }}
        name: Package the archive
        run: bash scripts/package-release.sh windows "${{ needs.validate.outputs.version }}" target/release/issuerd.exe ./dist
      - if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error

  windows-arm64-binary:
    name: windows arm64 binary
    needs: validate
    # Native build on the ARM64 Windows runner (free for public repos) — same
    # native-build philosophy as linux-arm64 (ubuntu-22.04-arm) and macos
    # (macos-15). Kerberos stays cfg(unix)-gated off on Windows; the vendored
    # openssl (WebAuthn) builds via Strawberry Perl under x64 emulation + the
    # ARM64 MSVC toolchain from the runner image. Same act treatment as
    # windows-binary: no Windows containers under act, so every step is gated
    # on env.ACT != 'true'.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v7
      - if: ${{ env.ACT != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs).
      - if: ${{ env.ACT != 'true' }}
        name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      # Vendored openssl (WebAuthn) needs a native perl on PATH; the committed
      # .cargo/config.toml points at a dev-host path, so override via env.
      - if: ${{ env.ACT != 'true' }}
        name: Strawberry Perl (vendored openssl build)
        run: choco install strawberryperl --no-progress -y
      - if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ env.ACT != 'true' }}
        uses: Swatinem/rust-cache@v2
      # cargo-auditable embeds the dependency tree in the binary (same as the
      # Dockerfile) so the SBOM scan sees every crate.
      - if: ${{ env.ACT != 'true' }}
        uses: taiki-e/install-action@cargo-auditable
      - if: ${{ env.ACT != 'true' }}
        name: Build the release binary
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: cargo auditable build --locked --release --bin issuerd
      - if: ${{ env.ACT != 'true' }}
        name: Smoke-run the binary
        run: ./target/release/issuerd.exe --version
      # Native unit suite on the ARM64 runner, release profile so the deps
      # compiled for the binary are reused (dev profile would rebuild the
      # whole tree). --lib excludes the Docker-backed integration suites —
      # same philosophy as the linux-arm64 unit run; crypto paths (aws-lc-rs,
      # ring) get real ARM64 coverage here.
      - if: ${{ env.ACT != 'true' }}
        name: Unit tests (native)
        run: cargo test --locked --release --workspace --lib
      - if: ${{ env.ACT != 'true' }}
        name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o syft.zip https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_windows_amd64.zip
          powershell.exe -NoProfile -Command "Expand-Archive -Force -LiteralPath '$(cygpath -w syft.zip)' -DestinationPath '$(cygpath -w "$HOME/bin")'"
          rm syft.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - if: ${{ env.ACT != 'true' }}
        name: Package the archive
        run: bash scripts/package-release.sh windows-arm64 "${{ needs.validate.outputs.version }}" target/release/issuerd.exe ./dist
      - if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-dist
          path: dist/
          if-no-files-found: error

  macos-binary:
    name: macOS arm64 binary (build + test + package)
    needs: validate
    # Native build + full workspace tests on an Apple Silicon runner (macos-13
    # is Intel — avoid), then packages the shipped macOS arm64 archive like the
    # other platform jobs. Not part of per-commit CI. Skipped under act like
    # the heavy call (no macOS runners there; vars.ACT because job-level `if`
    # has no env context) — the release job tolerates the missing macos-dist
    # artifact in rehearsal.
    if: ${{ vars.ACT != 'true' }}
    runs-on: macos-15
    env:
      # Pin the deployment target to the aarch64-apple-darwin std minimum
      # instead of letting the host SDK raise the floor to the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs panics
      # without webclientsrc/dist).
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-auditable embeds the dependency tree in the binary (same as the
      # Dockerfile) so the SBOM scan sees every crate.
      - uses: taiki-e/install-action@cargo-auditable
      # Native build, no cross tooling: openssl-sys probes
      # /opt/homebrew/opt/openssl@3 (preinstalled on the image; brew install
      # is idempotent), Kerberos comes from the system GSS.framework
      # (libgssapi-sys auto-detects the Apple impl), and bindgen's libclang
      # from the preinstalled Xcode toolchain.
      - name: System dependencies (OpenSSL)
        run: brew install openssl@3
      - name: Build the release binary
        run: cargo auditable build --locked --release --bin issuerd
      - name: Smoke-run the binary
        run: ./target/release/issuerd --version
      # Full workspace suite, not just --lib: Docker-dependent suites
      # (testcontainers, Keycloak/federation targets) probe availability and
      # skip gracefully — macOS runners have no Docker — while the in-process
      # E2E tests run for real.
      - name: cargo test
        run: cargo test --locked --workspace
      - name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_darwin_arm64.tar.gz | tar -xz -C "$HOME/bin" syft
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Package the archive
        run: bash scripts/package-release.sh macos "${{ needs.validate.outputs.version }}" target/release/issuerd ./dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [validate, linux-binary, linux-arm64, windows-binary, windows-arm64-binary, macos-binary, heavy]
    # Gate on every need, tolerating ONLY skips (act leaves out the heavy
    # call and the macos-binary job): a failed suite or packaging job means
    # no GitHub Release.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      attestations: write  # build-provenance attestations
      id-token: write      # OIDC token for the attestation signing
    steps:
      # Never download "all" artifacts here: the docker/build-push-action jobs
      # auto-upload *.dockerbuild build-record artifacts that download-artifact
      # cannot fetch (both v0.1.3 runs died on exactly that). Pull only what
      # this job uses.
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-dist'
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          # Named artifacts extract into cwd, not a per-artifact directory —
          # keep the release-notes/release-notes.md layout the steps expect.
          path: release-notes
      # Packed by heavy.yml's conformance job (single tarball). Absent under
      # act — the heavy call is skipped there.
      - uses: actions/download-artifact@v8
        if: ${{ env.ACT != 'true' }}
        with:
          name: conformance-evidence
          path: conformance-evidence
      # Real runs must ship all five platforms; rehearsal (act) has no macOS
      # job, so macos-dist is only required by this check, never under act.
      - name: Artifacts complete (real runs)
        if: ${{ env.ACT != 'true' }}
        run: |
          ls linux-dist/*.tar.gz linux-dist/*.sbom.cyclonedx.json \
             linux-arm64-dist/*.tar.gz linux-arm64-dist/*.sbom.cyclonedx.json \
             windows-dist/*.zip windows-dist/*.sbom.cyclonedx.json \
             windows-arm64-dist/*.zip windows-arm64-dist/*.sbom.cyclonedx.json \
             macos-dist/*.tar.gz macos-dist/*.sbom.cyclonedx.json \
             conformance-evidence/conformance-evidence.tar.gz
      - name: SHA256SUMS.txt
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          : > SHA256SUMS.txt
          for d in linux-dist linux-arm64-dist windows-dist windows-arm64-dist macos-dist; do
            if [ -d "$d" ]; then (cd "$d" && sha256sum *) >> SHA256SUMS.txt; fi
          done
          # Standalone conformance evidence asset (absent under act).
          if [ -f conformance-evidence/conformance-evidence.tar.gz ]; then
            mv conformance-evidence/conformance-evidence.tar.gz \
               "issuerd_${VERSION}_conformance-evidence.tar.gz"
            sha256sum "issuerd_${VERSION}_conformance-evidence.tar.gz" >> SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
      - name: Build-provenance attestation
        if: ${{ env.ACT != 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            linux-dist/*
            linux-arm64-dist/*
            windows-dist/*
            windows-arm64-dist/*
            macos-dist/*
            issuerd_*_conformance-evidence.tar.gz
      - name: Create the GitHub Release
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            linux-dist/*
            linux-arm64-dist/*
            windows-dist/*
            windows-arm64-dist/*
            macos-dist/*
            issuerd_*_conformance-evidence.tar.gz
            SHA256SUMS.txt
      - name: Release contents (always logged — this is what rehearsal inspects)
        run: |
          ls -l *-dist/
          ls -l issuerd_*_conformance-evidence.tar.gz 2>/dev/null \
            || echo "(no conformance evidence — act rehearsal)"
          echo '--- release notes ---'
          cat release-notes/release-notes.md

name: Heavy suites

# Heavy Docker-based suites that are too slow for per-commit CI (and skip
# gracefully there): federation against real Samba AD DC + OpenLDAP, the
# two-node cluster E2E, the Keycloak dual-target parity run, the OIDF
# conformance suite (with the run reports uploaded as evidence artifacts),
# and the release binary build (which embeds the web client). Runs nightly
# at 03:17 UTC (off the top-of-hour herd), on manual trigger (Actions →
# "Heavy suites" → Run workflow), and as a reusable workflow called by
# release.yml on v* tag pushes — in that mode the jobs run inside the release
# run, so the conformance evidence artifact lands where the release job can
# attach it to the GitHub Release. Scheduled runs only fire on the default
# branch, and GitHub disables them after 60 days of repository inactivity.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  federation:
    name: federation (Samba AD DC + OpenLDAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      # --wait blocks until the samba-dc/openldap healthchecks (real LDAP
      # binds, see docker-compose.integration.yml) report healthy.
      - name: Start the federation stack
        run: >
          docker compose -f docker-compose.integration.yml
          up -d --wait --wait-timeout 300 postgres samba-dc openldap
      - name: Seed OpenLDAP fixtures
        run: ./scripts/seed-openldap.sh
      - name: Samba AD DC tests
        run: cargo test --locked --test integration federation_samba
      - name: OpenLDAP tests
        run: cargo test --locked --test integration federation_ldap -- --ignored
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  cluster-e2e:
    name: cluster E2E (two nodes behind nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - name: Build and start the two-node cluster
        run: docker compose -f docker-compose.cluster.yml up -d --build
      - name: Wait for the load balancer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/ready >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.cluster.yml logs
          echo "cluster did not become ready in 5 minutes"
          exit 1
      - name: Cluster E2E tests
        run: ISSUERD_CLUSTER_E2E=1 cargo test --locked --test integration cluster_e2e
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.cluster.yml down -v

  keycloak-parity:
    name: dual-target parity vs Keycloak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - name: Start reference Keycloak
        run: docker compose -f docker-compose.integration.yml up -d --wait --wait-timeout 300 keycloak
      - name: Run integration tests against Issuerd AND Keycloak
        run: ISSUERD_TEST_TARGET=both cargo test --locked --test integration
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  release-build:
    name: release binary (embedded web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build panics without webclientsrc/dist
      # (crates/issuerd-server/build.rs) — build the SPA first.
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - run: cargo build --locked --bin issuerd --release
      - name: Smoke-run the binary
        run: ./target/release/issuerd --version

  conformance:
    name: OIDF conformance suite (evidence)
    runs-on: ubuntu-latest
    # Fresh-runner builds are the slow path: the suite JAR (maven) and the
    # Issuerd release binary are both compiled inside Docker. Bound hangs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The suite sources are gitignored (tests/conformance/conformance-suite)
      # — clone fresh at the pinned, validated release tag.
      - name: Clone the OIDF conformance suite
        run: >
          git clone --depth 1 --branch release-v5.2.4
          https://gitlab.com/openid/conformance-suite.git
          tests/conformance/conformance-suite
      # run.sh builds images, runs all three plans, exports reports into
      # tests/conformance/results/, tears the stack down, and propagates the
      # conformance-run exit code. It exports DOCKER_HOST_UID/GID=$(id -u/g)
      # on Linux so the runner containers can write into the bind-mounted
      # ./pki and ./results (the ubuntu-latest user is 1001, not the compose
      # default 1000 — without this pki-init exits 1 on Permission denied).
      - name: Run the conformance suite (hermetic stack)
        working-directory: tests/conformance
        run: ./run.sh
      # Evidence: html-reports-*/index.html, export-json/, exports/ zips and
      # the oidcc-*-output.log runner logs, packed as ONE tarball. release.yml
      # attaches that file to the GitHub Release as a standalone asset (like
      # the SBOMs — not part of the binary distros). Uploaded on failure too —
      # a red run is exactly when the evidence matters.
      - name: Pack the evidence bundle
        if: always()
        working-directory: tests/conformance
        run: |
          set -euo pipefail
          if [ -d results ]; then
            tar -czf conformance-evidence.tar.gz -C results .
          else
            echo "conformance run died before producing results/" > MISSING.txt
            tar -czf conformance-evidence.tar.gz MISSING.txt
          fi
          ls -lh conformance-evidence.tar.gz
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: tests/conformance/conformance-evidence.tar.gz
          retention-days: 30
          if-no-files-found: error

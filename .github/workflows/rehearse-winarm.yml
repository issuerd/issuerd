# TEMPORARY branch-rehearsal workflow for the new platform release jobs
# (windows-11-arm, macOS x86_64). DELETE before merging
# feat/release-windows-arm64-macos-amd64.
# The real jobs live in release.yml (tag-gated); this file exists to iterate
# the new builds on live runners without pushing tags. It mirrors the
# windows-arm64-binary job step for step plus the x86_64 half of macos-binary
# — keep them in sync while it lives.
name: rehearse-new-platforms
on:
  push:
    branches: [feat/release-windows-arm64-macos-amd64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearse-new-platforms
  cancel-in-progress: true

jobs:
  windows-arm64-binary:
    name: windows arm64 binary (rehearsal)
    runs-on: windows-11-arm
    # Keep in sync with the windows jobs in release.yml: silence the LNK4099
    # wall from the vendored OpenSSL objects (they ship no PDB).
    env:
      RUSTFLAGS: "-C link-args=/ignore:4099"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs panics
      # without webclientsrc/dist).
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      # Vendored openssl (WebAuthn) needs a native perl on PATH; x64 Strawberry
      # Perl runs under emulation on windows-11-arm.
      - name: Strawberry Perl (vendored openssl build)
        run: choco install strawberryperl --no-progress -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-auditable embeds the dependency tree in the binary so the SBOM
      # scan sees every crate.
      - uses: taiki-e/install-action@cargo-auditable
      - name: Build the release binary
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: cargo auditable build --locked --release --bin issuerd
      - name: Smoke-run the binary
        run: ./target/release/issuerd.exe --version
      # Release profile reuses the deps compiled for the binary; --lib
      # excludes the Docker-backed integration suites.
      - name: Unit tests (native)
        run: cargo test --locked --release --workspace --lib
      - name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o syft.zip https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_windows_amd64.zip
          powershell.exe -NoProfile -Command "Expand-Archive -Force -LiteralPath '$(cygpath -w syft.zip)' -DestinationPath '$(cygpath -w "$HOME/bin")'"
          rm syft.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Package the archive
        run: bash scripts/package-release.sh windows-arm64 0.0.0-rehearsal target/release/issuerd.exe ./dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-dist
          path: dist/
          if-no-files-found: error

  macos-amd64-binary:
    name: macOS amd64 binary (rehearsal)
    runs-on: macos-15
    env:
      # Same deployment-target pin as the real macos-binary job.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Same override as the real macos-binary job: .cargo/config.toml points
      # OPENSSL_SRC_PERL at a Windows Strawberry Perl, and the vendored
      # x86_64 openssl build needs the system perl instead. Job-level so the
      # build and test steps agree (rerun-if-env-changed).
      OPENSSL_SRC_PERL: /usr/bin/perl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs panics
      # without webclientsrc/dist).
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # cargo-auditable embeds the dependency tree in the binary so the SBOM
      # scan sees every crate.
      - uses: taiki-e/install-action@cargo-auditable
      # openssl is vendored for this target (Homebrew's openssl@3 is
      # arm64-only) — system perl + Xcode clang build it from source.
      - name: Rosetta 2 (x86_64 run support)
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build the x86_64 release binary
        run: cargo auditable build --locked --release --bin issuerd --target x86_64-apple-darwin
      - name: Smoke-run the x86_64 binary (Rosetta)
        run: ./target/x86_64-apple-darwin/release/issuerd --version
      # Release profile reuses the deps compiled for the binary; --lib
      # excludes the Docker-backed suites (no Docker on macOS runners anyway).
      - name: Unit tests (x86_64, Rosetta)
        run: cargo test --locked --release --workspace --lib --target x86_64-apple-darwin
      - name: Install syft (SBOM)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_darwin_arm64.tar.gz | tar -xz -C "$HOME/bin" syft
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Package the x86_64 archive
        run: bash scripts/package-release.sh macos-amd64 0.0.0-rehearsal target/x86_64-apple-darwin/release/issuerd ./dist-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: macos-amd64-dist
          path: dist-amd64/
          if-no-files-found: error

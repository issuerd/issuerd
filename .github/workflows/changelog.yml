name: Changelog

# PR gate: every pull request must touch CHANGELOG.md (add an entry under
# '## [Unreleased]') unless it carries the 'no-changelog' label — intended
# for changes with no user-visible impact (CI, docs, pure refactorings).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - name: Check CHANGELOG.md is in the PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR_NUMBER" --name-only | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated — OK."
          else
            echo "::error::This PR does not update CHANGELOG.md. Add an entry under '## [Unreleased]' or apply the 'no-changelog' label."
            exit 1
          fi

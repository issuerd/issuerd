name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (rapid pushes, PR updates).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - run: cargo check --locked --all-targets --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - run: cargo doc --locked --workspace --no-deps

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo audit is a cargo subcommand — needs cargo on PATH, which bare
      # (self-hosted / container) runners do not provide out of the box.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  webclient:
    name: web client (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webclientsrc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # generated/ is gitignored — regenerate the SDK from the committed
      # openapi.json before type-checking/building (mirrors the Dockerfile).
      - run: npm ci
      - run: npm run generate-api
      - run: npm run test
      - run: npm run build

  coverage:
    name: coverage (rust + webclient)
    runs-on: ubuntu-latest
    permissions:
      # The badge-publish step pushes the badge JSONs to the `badges` branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-llvm-cov shells out to llvm-profdata/llvm-cov from this component.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # This job is the Linux CI test run (the macos job additionally runs the
      # suite natively on Apple Silicon):
      # the full workspace suite — unit + root integration tests — runs once,
      # instrumented. Docker-dependent suites skip gracefully here and run
      # for real in heavy.yml. The lcov export feeds
      # scripts/coverage_badges.py and is kept as an artifact (render locally:
      # `genhtml rust-lcov.info`).
      - name: Rust tests + coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path rust-lcov.info
      # llvm-cov cannot instrument doctests on stable, so they are not part
      # of the coverage run — execute them uninstrumented instead.
      - name: Rust doc tests
        run: cargo test --locked --workspace --doc
      - name: Web client coverage
        working-directory: webclientsrc
        run: |
          npm ci
          npm run generate-api
          npm run test -- --coverage
      - name: Build badge JSONs
        run: python3 scripts/coverage_badges.py --rust rust-lcov.info --webclient webclientsrc/coverage/coverage-summary.json --outdir badges
      - name: Job summary
        run: |
          python3 - <<'EOF'
          import json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Coverage\n\n| Suite | Line coverage |\n|---|---|\n')
              for name in ('rust', 'webclient'):
                  with open(f'badges/{name}.json') as f:
                      badge = json.load(f)
                  out.write(f"| {name.capitalize()} | {badge['message']} |\n")
          EOF
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          # rust-lcov.info is renderable locally (genhtml); webclientsrc's
          # coverage/ includes the browsable lcov-report/ HTML.
          name: coverage-reports
          path: |
            rust-lcov.info
            webclientsrc/coverage/
          retention-days: 14
      # Self-hosted badges: no external coverage service. The two JSONs feed
      # shields.io endpoint badges via raw.githubusercontent.com/.../badges/*.
      - name: Publish badges (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch badges "$REPO" /tmp/badges-branch 2>/dev/null \
            || git clone --depth 1 "$REPO" /tmp/badges-branch
          cd /tmp/badges-branch
          git checkout badges 2>/dev/null || git checkout --orphan badges
          git rm -rf --quiet . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/badges/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "coverage badges from ${{ github.sha }}" || { echo "badges unchanged"; exit 0; }
          git push origin badges

  # macOS arm64: native build + tests on an Apple Silicon runner (macos-13 is
  # Intel — avoid). Native means none of the cross-compile toolchain juggling
  # applies: OpenSSL from Homebrew (openssl-sys probes /opt/homebrew/opt/
  # openssl@3 on aarch64-apple-darwin), Kerberos from the system GSS.framework
  # (libgssapi-sys auto-detects the Apple impl), bindgen's libclang from the
  # preinstalled Xcode toolchain (clang-sys searches `xcode-select
  # --print-path`).
  macos:
    name: macOS arm64 (build + test)
    runs-on: macos-15
    env:
      # Pin the deployment target to the aarch64-apple-darwin std minimum
      # instead of letting the host SDK raise the floor to the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webclientsrc/package-lock.json
      # The release build embeds the SPA (crates/issuerd-server/build.rs panics
      # without webclientsrc/dist).
      - name: Build the web client
        working-directory: webclientsrc
        run: npm ci && npm run generate-api && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # openssl@3 is preinstalled on the runner image; brew install is
      # idempotent and pins the dependency explicitly.
      - name: System dependencies (OpenSSL)
        run: brew install openssl@3
      - name: Build the release binary
        run: cargo build --locked --release --bin issuerd
      - name: Smoke-run the binary
        run: ./target/release/issuerd --version
      # Full workspace suite, not just --lib: Docker-dependent suites
      # (testcontainers, Keycloak/federation targets) probe availability and
      # skip gracefully — macOS runners have no Docker — while the in-process
      # E2E tests run for real.
      - name: cargo test
        run: cargo test --locked --workspace
      # Kept downloadable for manual on-device verification.
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: target/release/issuerd
          retention-days: 14

  openapi-sync:
    name: openapi.json in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (libgssapi, openssl)
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config libclang-dev
      - name: Regenerate the spec from the backend
        run: cargo run --locked --bin issuerd -- openapi -o /tmp/openapi.json
      - name: Diff against the committed spec
        run: |
          if ! diff -u webclientsrc/openapi.json /tmp/openapi.json; then
            echo "::error::webclientsrc/openapi.json is stale. Regenerate with: cargo run --bin issuerd -- openapi -o webclientsrc/openapi.json"
            exit 1
          fi

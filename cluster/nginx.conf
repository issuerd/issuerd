# nginx load balancer for the Issuerd cluster demo stack.
# Mounted as /etc/nginx/conf.d/default.conf (http context comes from the main
# nginx.conf). Passive health checks only (nginx OSS): a node that errors or
# times out 3 times within 10s is skipped for 10s.

upstream issuerd_nodes {
    least_conn;
    server issuerd-1:8080 max_fails=3 fail_timeout=10s;
    server issuerd-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    server_name _;

    # Compose healthcheck endpoint — answered by nginx itself, never proxied.
    location = /lb-health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://issuerd_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Retry idempotent-safe failures on the peer that is still up.
        proxy_next_upstream error timeout http_502 http_503;
    }
}

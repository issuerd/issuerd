name: issuerd-mcp-admin

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: issuerd
      POSTGRES_PASSWORD: issuerd_secret
      POSTGRES_DB: issuerd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuerd -d issuerd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  issuerd:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: issuerd:mcp-admin-local
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - ./issuerd.compose.toml:/etc/issuerd/issuerd.toml:ro
      - ./provision.yaml:/etc/issuerd/provision.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "issuerd", "healthcheck", "--url", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  setup:
    build: ./client
    image: issuerd-mcp-admin-client:local
    network_mode: service:issuerd
    restart: "no"
    environment:
      ISSUERD_BASE_URL: http://127.0.0.1:8080
      REALM: mcp-demo
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      MCP_CLIENT_ID: mcp-admin-native
      MCP_PASSWORD: Password123!
    command: ["node", "dist/src/setup.js"]
    depends_on:
      issuerd:
        condition: service_healthy

  client:
    build: ./client
    image: issuerd-mcp-admin-client:local
    network_mode: service:issuerd
    restart: "no"
    environment:
      ISSUERD_ISSUER: http://127.0.0.1:8080/realms/mcp-demo
      MCP_CLIENT_ID: mcp-admin-native
      MCP_USERNAME: mcp-admin
      MCP_PASSWORD: Password123!
      MCP_LOGIN_MODE: script
      MCP_ERA: auto
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres-data:
    driver: local

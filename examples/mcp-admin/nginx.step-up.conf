events {}

http {
  map $http_x_mcp_demo_node $mcp_upstream {
    default "http://issuerd-1:8080";
    "1" "http://issuerd-1:8080";
    "2" "http://issuerd-2:8080";
    "3" "http://issuerd-3:8080";
  }

  map $http_x_mcp_demo_node $mcp_node {
    default "1";
    "1" "1";
    "2" "2";
    "3" "3";
  }

  server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;

    location / {
      proxy_pass $mcp_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      add_header X-MCP-Demo-Node $mcp_node always;
    }
  }
}

# Provisioning for the agentic MCP example (docker-compose.yml in this
# directory). Applied exactly once at first startup against an empty database
# (marker claim); wipe the volume with `docker compose down -v` to re-provision.
#
# Creates:
#   - master realm with admin/admin (realm-management roles → admin API + SPA)
#   - the `demo` realm with alice/changeme and bob/changeme
#   - chat-app (the ChatApp client: orders:read is a DEFAULT scope so ordinary
#     logins carry it; refunds:execute is OPTIONAL so it only ever appears in
#     CIBA step-up tokens)
#   - mcp-server (audience target for RFC 8693 exchanges; the setup container
#     flips its `token.exchange.enabled` attribute post-provision — client
#     attributes are not expressible in this file)
#
# All URLs point at http://localhost:8080 (issuerd) and http://localhost:5108
# (ChatApp).

marker: agentic-mcp-demo

realms:
  - name: master
    display_name: Master
    enabled: true
    ssl_required: external
    default_role: user

  - name: demo
    display_name: Agentic MCP demo
    enabled: true
    ssl_required: external
    default_role: user
    registration_enabled: false
    verify_email_enabled: false
    reset_password_allowed: false

roles:
  - realm: master
    name: admin
    description: Realm administrator
  - realm: master
    name: user
    description: Standard user
  - realm: master
    name: manage-realm
    description: Manage realm settings
  - realm: master
    name: view-realm
    description: View realm settings
  - realm: master
    name: manage-users
    description: Manage users
  - realm: master
    name: view-users
    description: View users
  - realm: master
    name: manage-clients
    description: Manage clients
  - realm: master
    name: view-clients
    description: View clients
  - realm: master
    name: impersonation
    description: Impersonate users
  - realm: demo
    name: user
    description: Standard user role

clients:
  # Public client used by the admin console SPA (redirect URIs mirror
  # build_admin_cli_client for the in-memory bootstrap).
  - realm: master
    client_id: admin-cli
    name: Admin CLI
    description: Public client used by the admin console SPA.
    enabled: true
    public_client: true
    bearer_only: false
    redirect_uris:
      - http://localhost:8080/
      - http://localhost:8080/admin/console/callback
      - http://localhost:8080/swagger-ui/oauth2-redirect.html
    web_origins:
      - http://localhost:8080
    default_scopes:
      - openid
      - profile
    optional_scopes:
      - email
    consent_required: false
    full_scope_allowed: true

  # The chat application (FastAPI + HTMX). Confidential: auth-code + PKCE for
  # the browser login, client-secret Basic at the token endpoint, CIBA
  # bc-authorize for the step-up.
  - realm: demo
    client_id: chat-app
    name: Chat App (agentic demo)
    description: Confidential chat app; RFC 8693 token exchange + CIBA client
    enabled: true
    public_client: false
    bearer_only: false
    secret: f7ae7e19-3850-43d7-b27e-97c0020a84a4
    redirect_uris:
      - http://localhost:5108/auth/callback
    web_origins:
      - http://localhost:5108
    default_scopes:
      - openid
      - profile
      - orders:read
    optional_scopes:
      - refunds:execute
    consent_required: false
    full_scope_allowed: true

  # Pure audience target for RFC 8693 exchanges (no flows of its own). The
  # `token.exchange.enabled=true` attribute is applied post-provision by the
  # setup container — client attributes are not provisionable. The optional
  # scopes keep orders:read / refunds:execute from being dropped by the
  # exchange's target-client scope intersection.
  - realm: demo
    client_id: mcp-server
    name: MCP server (audience target)
    description: Token-exchange audience for the agentic demo; resource server
    enabled: true
    public_client: false
    bearer_only: false
    secret: 87a8058d-450c-4f10-9ca7-21f3f4b79830
    redirect_uris: []
    web_origins: []
    default_scopes:
      - openid
    optional_scopes:
      - orders:read
      - refunds:execute
    consent_required: false
    full_scope_allowed: true

users:
  - realm: master
    username: admin
    email: admin@issuerd.local
    email_verified: true
    first_name: Admin
    last_name: User
    enabled: true
    password: admin
    realm_roles:
      - admin
      - user
      - manage-realm
      - view-realm
      - manage-users
      - view-users
      - manage-clients
      - view-clients
      - impersonation
    groups: []
    attributes: {}

  # Demo users. Subs are random UUIDs assigned at provision time; the setup
  # container reads them back via the admin API to seed shop.orders.
  - realm: demo
    username: alice
    email: alice@demo.example.com
    email_verified: true
    first_name: Alice
    last_name: Anderson
    enabled: true
    password: changeme
    realm_roles:
      - user
    groups: []
    attributes: {}

  - realm: demo
    username: bob
    email: bob@demo.example.com
    email_verified: true
    first_name: Bob
    last_name: Brown
    enabled: true
    password: changeme
    realm_roles:
      - user
    groups: []
    attributes: {}

# Advisory ignores for `cargo audit` — keep in sync with the `ignore` list in
# deny.toml (cargo deny and cargo audit read separate config files).
#
# Temporary ignores:
#
# - RUSTSEC-2026-0367 / -0368 / -0369 (zip extraction), added 2026-10-18:
#   zip 3.0.0 is only a build dependency of utoipa-swagger-ui 9.0.2 and is not
#   linked into the daemon. Issuerd enables the `vendored` feature, so the build
#   script reads the static archive compiled into utoipa-swagger-ui-vendored,
#   not a downloaded or user-supplied archive. Its manual extraction uses
#   ZipArchive::by_index with enclosed_name, not the affected extract() APIs.
#   Remove all three ignores when utoipa-swagger-ui upgrades to zip >= 9.0.0.
#
# Resolved advisories without ignores:
#
# - RUSTSEC-2025-0134 (rustls-pemfile unmaintained): resolved for real — the
#   redis 0.29 upgrade moved to rustls-native-certs 0.8 (rustls-pki-types);
#   the crate is in neither the lockfile nor the build graph. No ignore.
#
# - RUSTSEC-2024-0449 (unsafe-libyaml unmaintained): resolved for real —
#   config/provision YAML moved from serde_yaml to serde-saphyr (pure-Rust
#   granit-parser); serde_yaml/unsafe-libyaml are out of the lockfile. No
#   ignore.
#
# - RUSTSEC-2023-0071 (rsa/Marvin): resolved in the BUILD graph — jsonwebtoken
#   uses the aws_lc_rs backend and RSA key generation uses OpenSSL, so rsa is
#   never compiled (verifiable: `cargo tree -i rsa --target all` prints
#   nothing). rsa still appears in Cargo.lock as an *inactivated weak optional
#   edge*: any sqlx feature that touches its driver crates (migrate, uuid,
#   chrono, json) records `sqlx-mysql` in the lock via `sqlx-mysql?/...` weak
#   dependencies, and sqlx-mysql lists rsa. This is the upstream
#   rust-lang/cargo#10801 lockfile quirk; the lock entry is never downloaded,
#   compiled, or linked into issuerd (postgres-only sqlx feature set — the
#   `mysql` feature is never enabled, including under --all-features, which
#   applies to workspace crates only). The ignore below exists solely to stop
#   cargo-audit's feature-blind lockfile scan from flagging a crate the build
#   never sees; drop it if sqlx removes the weak edges or cargo fixes lockfile
#   pruning.

[advisories]
ignore = [
    # Not an accepted risk: rsa is absent from the compiled graph (cargo tree
    # --target all); lockfile-only entry via sqlx's inactivated
    # `sqlx-mysql?/...` weak optional deps (cargo#10801). See header comment.
    "RUSTSEC-2023-0071",
    # Temporary build-only vendored-archive ignores; see header comment.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

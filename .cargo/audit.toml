# Advisory ignores for `cargo audit` — keep in sync with the `ignore` list in
# deny.toml (cargo deny and cargo audit read separate config files).

[advisories]
ignore = [
    # rsa crate: timing side-channel in RSA PRIVATE-KEY operations (Marvin Attack)
    # — decryption AND PKCS#1 v1.5 signing; verification (public-key) is unaffected.
    # Issuerd never decrypts RSA, but RS256/384/512 JWT signing runs through the rsa
    # crate: jsonwebtoken's `rust_crypto` backend implements RSA signing with
    # rsa::SigningKey (ring is only used for Ed25519 key generation). Every fresh
    # install persists an active RS256 key, and realms pinned via the
    # `default_signature_algorithm` attribute sign every token through this path, so
    # the network-observable timing surface is reachable in supported configurations.
    # Accepted residual risk (NOT non-applicable): no patched rsa release exists
    # (still open against 0.9.10; upstream RustCrypto/RSA#626/#680/#702), the sign
    # path applies RNG blinding, and new deployments default to EdDSA (RS256 signing
    # is per-realm opt-in). Residual plan: migrate RSA key generation off rsa
    # (openssl is already in-tree) and evaluate jsonwebtoken's aws_lc_rs backend;
    # drop this ignore once rsa leaves the tree entirely.
    "RUSTSEC-2023-0071",
    # rustls-pemfile is unmaintained but still a transitive dependency of redis
    # and rustls-native-certs. Direct usage migrated to rustls-pki-types.
    "RUSTSEC-2025-0134",
]

# Advisory ignores for `cargo audit` — keep in sync with the `ignore` list in
# deny.toml (cargo deny and cargo audit read separate config files).
#
# Two temporary exceptions are documented below and mirrored in deny.toml.
# Previously resolved advisories that once carried (or nearly carried) ignores:
#
# - RUSTSEC-2026-0367 / -0368 / -0369 (zip extraction): resolved for real —
#   the utoipa 6.0 / utoipa-swagger-ui 10.0.2 upgrade (2026-10) builds with
#   zip ^9.0 (>= 9.0.0 is the patched line). zip was only ever a build
#   dependency of utoipa-swagger-ui's `vendored` feature, never linked into
#   the daemon.
#
# - RUSTSEC-2025-0134 (rustls-pemfile unmaintained): resolved for real — the
#   redis 0.29 upgrade moved to rustls-native-certs 0.8 (rustls-pki-types);
#   the crate is in neither the lockfile nor the build graph. No ignore.
#
# - RUSTSEC-2024-0449 (unsafe-libyaml unmaintained): resolved for real —
#   config/provision YAML moved from serde_yaml to serde-saphyr (pure-Rust
#   granit-parser); serde_yaml/unsafe-libyaml are out of the lockfile. No
#   ignore.
#
# - RUSTSEC-2023-0071 (rsa/Marvin): resolved for real — jsonwebtoken uses the
#   aws_lc_rs backend and RSA key generation uses OpenSSL, so rsa was never
#   compiled; the sqlx 0.9 upgrade (2026-10) removed the last lockfile trace
#   (sqlx-mysql's rsa dependency moved behind the off-by-default `mysql-rsa`
#   feature, so cargo no longer records the inactivated weak edge — the
#   cargo#10801 lockfile quirk no longer applies). rsa is in neither the
#   lockfile nor the build graph. No ignore.

[advisories]
# RUSTSEC-2026-0459 requires a less-trusted local writer to supply a crafted
# database and sibling WAL; Issuerd maintains these files with owner-only 0600
# permissions. SQLx 0.9.0 requires libsqlite3-sys <0.38 while the fix requires
# 0.39. The compatibility change is merged but unreleased upstream; upgrade and
# remove this ignore when https://github.com/transact-rs/sqlx/pull/4502 ships.
#
# RUSTSEC-2026-0440 is an informational unmaintained notice, not a
# vulnerability. astral-tokio-tar is reachable only through dev-only
# testcontainers 0.28.0 and is not shipped in the daemon. No patched
# testcontainers release exists yet; remove this ignore when
# https://github.com/testcontainers/testcontainers-rs/pull/1006 ships.
ignore = [
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0440",
]

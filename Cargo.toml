[workspace]
members = [
    "crates/issuerd-core",
    "crates/issuerd-protocol",
    "crates/issuerd-auth-flow",
    "crates/issuerd-token",
    "crates/issuerd-storage",
    "crates/issuerd-federation",
    "crates/issuerd-admin-api",
    "crates/issuerd-cluster",
    "crates/issuerd-server",
]
resolver = "2"

[package]
name = "issuerd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Issuerd: a horizontally scalable, modular IAM server implementing OIDC/OAuth2 (Keycloak-inspired), with embedded admin/account web consoles"
keywords = ["oidc", "oauth2", "iam", "identity", "keycloak"]
categories = ["authentication", "network-programming", "web-programming"]
readme = "README.md"

[dependencies]
issuerd-core = { workspace = true }
issuerd-protocol = { workspace = true }
issuerd-auth-flow = { workspace = true }
issuerd-token = { workspace = true }
issuerd-storage = { workspace = true }
issuerd-cluster = { workspace = true }
issuerd-admin-api = { workspace = true }
issuerd-server = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
anyhow = { workspace = true }
utoipa = { workspace = true }
rustls = { workspace = true }
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }
tracing-journald = { workspace = true }

[[bin]]
name = "issuerd"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true }
reqwest = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
bytes = "1.6"
issuerd-federation = { workspace = true }
ldap3 = { workspace = true }
sqlx = { workspace = true }
ring = { workspace = true }
jsonwebtoken = { workspace = true }
testcontainers = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/issuerd/issuerd"
authors = ["Dmitry Andreev <da@issuerd.org>"]
rust-version = "1.95"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"

# HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "compression-br", "metrics"] }
hyper = { version = "1.4", features = ["full"] }
ipnet = "2.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_yaml = "0.9"

# Crypto
ring = "0.17"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
rustls-pki-types = "1.14"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
rand = "0.8"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }

# Cache / Cluster
redis = { version = "0.27", features = ["tokio-rustls-comp", "cluster-async"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Config
figment = { version = "0.10", features = ["env", "toml", "yaml", "json"] }

# Testing
mockall = "0.13"
rstest = "0.23"
proptest = "1.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

testcontainers = "0.28"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utility
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
regex = "1.10"
once_cell = "1.20"
dashmap = "6.1"
async-trait = "0.1"
futures = "0.3"
pin-project = "1.1"

# Password hashing
argon2 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
subtle = "2.6"
# Secret memory hygiene (zeroize-on-drop for key material buffers)
zeroize = "1.8"

# Email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "hostname", "builder", "tokio1", "tokio1-rustls-tls"] }

# Base64
base64 = "0.22"

# Test certificate generation
rcgen = "0.13"

# LDAP / Kerberos federation
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
libgssapi = "0.11"

# OpenAPI
utoipa = { version = "5.5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# CLI & embedding
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
mime_guess = "2.0"
axum-server = { version = "0.8", features = ["tls-rustls"] }
enable-ansi-support = "0.2"
sd-notify = "0.4"
tracing-journald = "0.3"

# QR code generation (TOTP enrollment)
qrcodegen = "1.8"

# WebAuthn / passkeys (MFA second factor)
# webauthn-rs-core depends on openssl without a feature gate; the vendored
# feature is only referenced from Windows targets (see issuerd-auth-flow), where no
# system OpenSSL is guaranteed. Unix builds keep linking the system OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# Internal crates (version pinned to workspace; version required for crates.io publish)
issuerd-core = { path = "crates/issuerd-core", version = "0.1.0" }
issuerd-protocol = { path = "crates/issuerd-protocol", version = "0.1.0" }
issuerd-auth-flow = { path = "crates/issuerd-auth-flow", version = "0.1.0" }
issuerd-token = { path = "crates/issuerd-token", version = "0.1.0" }
issuerd-storage = { path = "crates/issuerd-storage", version = "0.1.0" }
issuerd-federation = { path = "crates/issuerd-federation", version = "0.1.0" }
issuerd-admin-api = { path = "crates/issuerd-admin-api", version = "0.1.0" }
issuerd-cluster = { path = "crates/issuerd-cluster", version = "0.1.0" }
issuerd-server = { path = "crates/issuerd-server", version = "0.1.0" }

[profile.release]
# Strip the symbol table from the release binary: production images ship
# without it (smaller image); panics still carry messages, backtraces lose
# function names.
strip = true

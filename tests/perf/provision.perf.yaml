# Provisioning for the tests/perf benchmark stack.
# Applied exactly once at first startup against an empty database (marker
# claim); wipe with `docker compose -f docker-compose.perf.yml down -v`.
#
# Creates:
#   - master realm with admin/admin (manage-* roles → Admin API seeding)
#   - perf realm with perfuser/Perf-Pass-123! (CIBA approval identity)
#   - perf-service (confidential: ROPC, client_credentials, CIBA, introspect)
#   - perf-public (public auth-code client used by the browser-flow scenarios)
#
# Bulk users (user0001..user1000 with passwords, and the 100k disk-scale set)
# are seeded at runtime through the Admin API by the admin_users k6 scenario —
# see scripts/run.sh seed. Keycloak gets its 1000 users from the generated
# keycloak/realm-perf.json import instead.
#
# ssl_required = none: the stack is a fully internal network with no TLS by
# design (Keycloak runs start-dev HTTP too — symmetric comparison).

marker: perf-stack

realms:
  - name: master
    display_name: Master
    enabled: true
    ssl_required: none
    default_role: user

  - name: perf
    display_name: Performance Test Realm
    enabled: true
    ssl_required: none
    default_role: user
    registration_enabled: false
    attributes: {}

roles:
  - realm: master
    name: admin
    description: Realm administrator
  - realm: master
    name: user
    description: Standard user
  - realm: master
    name: manage-realm
    description: Manage realm settings
  - realm: master
    name: view-realm
    description: View realm settings
  - realm: master
    name: manage-users
    description: Manage users
  - realm: master
    name: view-users
    description: View users
  - realm: master
    name: manage-clients
    description: Manage clients
  - realm: master
    name: view-clients
    description: View clients
  - realm: master
    name: impersonation
    description: Impersonate users
  - realm: perf
    name: user
    description: Standard user role

clients:
  - realm: master
    client_id: admin-cli
    name: Admin CLI
    description: Public client used to obtain admin tokens for seeding.
    enabled: true
    public_client: true
    bearer_only: false
    redirect_uris:
      - http://issuerd:8080/
    web_origins:
      - http://issuerd:8080
    default_scopes:
      - openid
      - profile
    optional_scopes: []
    consent_required: false
    full_scope_allowed: true

  - realm: perf
    client_id: perf-service
    name: Perf Service Client
    description: Confidential client for ROPC / client_credentials / CIBA / introspection.
    enabled: true
    public_client: false
    bearer_only: false
    secret: perf-secret-9f8e7d6c5b4a
    redirect_uris: []
    web_origins: []
    default_scopes:
      - openid
      - profile
    optional_scopes:
      - email
    consent_required: false
    full_scope_allowed: true

  - realm: perf
    client_id: perf-public
    name: Perf Public Client
    description: Public client for the authorization-code browser flow scenario.
    enabled: true
    public_client: true
    bearer_only: false
    redirect_uris:
      - http://app.local/callback
      - http://localhost:4000/callback
      - http://localhost:8080/cb
    web_origins: []
    default_scopes:
      - openid
      - profile
    optional_scopes: []
    consent_required: false
    full_scope_allowed: true

users:
  - realm: master
    username: admin
    email: admin@issuerd.local
    email_verified: true
    first_name: Admin
    last_name: User
    enabled: true
    password: admin
    realm_roles:
      - admin
      - user
      - manage-realm
      - view-realm
      - manage-users
      - view-users
      - manage-clients
      - view-clients
      - impersonation
    groups: []
    attributes: {}

  - realm: perf
    username: perfuser
    email: perfuser@example.com
    email_verified: true
    first_name: Perf
    last_name: User
    enabled: true
    password: Perf-Pass-123!
    realm_roles:
      - user
    groups: []
    attributes: {}

bind = "0.0.0.0"
port = 8443
issuer_url = "https://op.conformance.test:8443"
# bootstrap-issuerd.sh and scripts/rotate-check.py sign in as admin/admin.
# Test-rig only: the hermetic network is unreachable from outside.
bootstrap_admin_password = "admin"

[tls]
cert_path = "/pki/op.crt"
key_path = "/pki/op.key"

[logging]
format = "json"
level = "info"

[web_ui]
enabled = true

[proxy]
trusted_proxies = []
trust_x_forwarded_for = true
trust_x_real_ip = true

# The hermetic stack's TLS is a local root CA; the OP's outbound HTTPS calls
# (back-channel logout delivery to the suite) must trust it.
[outbound_http]
extra_ca_bundle = "/pki/ca.crt"
# The hermetic network is entirely private (172.31.0.0/16): SSRF-guarded
# fetches (client jwks_uri, sector docs, request_uri objects) target the
# suite inside it. Test-rig only.
allow_private_addresses = true

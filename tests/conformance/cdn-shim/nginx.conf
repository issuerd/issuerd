# CDN shim: answers HTTPS requests for the external CDN hostnames referenced
# by the pristine conformance suite web UI, serving the vendored mirror under
# /srv/<host>/<path>. bind9 maps those hostnames to this container, and the
# cert (SAN: all shimmed hosts) comes from the local root CA the suite JVM
# already trusts.
#
# This file replaces the stock /etc/nginx/nginx.conf (not conf.d/default.conf)
# so the master-process error log can be pinned at warn: docker's 5s
# healthcheck execs a wget that nginx-as-PID-1 then reaps with SIGCHLD
# [notice] spam on every tick.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Deliberately silent: this container exists only to keep third-party
    # asset requests out of the error logs, so it must not add noise itself.
    access_log off;

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/shim-certs/cdn.crt;
        ssl_certificate_key /etc/nginx/shim-certs/cdn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            root /srv;
            # $host carries the shimmed hostname (cdn.jsdelivr.net, ...);
            # query strings (e.g. /css?family=PT+Sans) never reach the
            # file lookup.
            try_files /$host$uri =404;
        }
    }
}

// Hermetic conformance environment DNS.
// Authoritative for conformance.test plus the CDN hostnames mirrored by the
// cdn-shim container (the suite web UI references them; answering locally
// keeps HtmlUnit logs free of UnknownHostException). No recursion, no
// forwarders: every other name gets an instant REFUSED and no name
// resolution ever leaves the isolated network.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

zone "conformance.test" {
    type master;
    file "/etc/bind/zones/db.conformance.test";
};

// CDN shim zones — all share the same relative-records zone file.
zone "cdn.jsdelivr.net"       { type master; file "/etc/bind/zones/db.cdn-shim"; };
zone "cdnjs.cloudflare.com"   { type master; file "/etc/bind/zones/db.cdn-shim"; };
zone "cdn.datatables.net"     { type master; file "/etc/bind/zones/db.cdn-shim"; };
zone "fonts.googleapis.com"   { type master; file "/etc/bind/zones/db.cdn-shim"; };
zone "fonts.gstatic.com"      { type master; file "/etc/bind/zones/db.cdn-shim"; };
zone "oss.maxcdn.com"         { type master; file "/etc/bind/zones/db.cdn-shim"; };

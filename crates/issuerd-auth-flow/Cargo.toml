[package]
name = "issuerd-auth-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pluggable authentication flow engine (authenticators, required actions, MFA) for the Issuerd IAM server"
keywords = ["oidc", "iam", "authentication", "mfa"]
categories = ["authentication"]

[dependencies]
issuerd-core = { workspace = true }
issuerd-token = { workspace = true }
issuerd-cluster = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mockall = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
webauthn-rs = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
issuerd-storage = { workspace = true }
base64 = { workspace = true }

# webauthn-rs-core needs openssl with no feature gate; on Windows (no system
# OpenSSL) build it vendored from source. Requires a native Windows perl
# (e.g. Strawberry Perl) and MSVC build tools on PATH.
[target.'cfg(windows)'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

# macOS x86_64 builds are cross-compiled from arm64 runners, where Homebrew's
# openssl@3 is arm64-only — build vendored from source for this target too
# (system perl + Xcode clang suffice).
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

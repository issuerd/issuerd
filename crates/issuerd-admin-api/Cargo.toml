[package]
name = "issuerd-admin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Keycloak-compatible REST Admin API with OpenAPI for the Issuerd IAM server"
keywords = ["oidc", "iam", "keycloak", "openapi"]
categories = ["authentication", "web-programming"]

[dependencies]
issuerd-core = { workspace = true }
issuerd-auth-flow = { workspace = true }
issuerd-token = { workspace = true }
issuerd-storage = { workspace = true }
issuerd-federation = { workspace = true }
issuerd-cluster = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }
mockall = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true }
async-trait = { workspace = true }

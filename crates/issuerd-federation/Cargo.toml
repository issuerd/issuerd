[package]
name = "issuerd-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "User federation SPI (LDAP, Kerberos, custom providers) for the Issuerd IAM server"
keywords = ["ldap", "kerberos", "iam", "federation"]
categories = ["authentication"]

[dependencies]
issuerd-core = { workspace = true }
issuerd-storage = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ldap3 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { workspace = true }

[dev-dependencies]
issuerd-cluster = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[package]
name = "issuerd-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Storage backends (PostgreSQL via sqlx, in-memory, JSON file) for the Issuerd IAM server"
keywords = ["oidc", "iam", "postgresql"]
categories = ["authentication", "database"]

[dependencies]
issuerd-core = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mockall = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
testcontainers = { workspace = true }
uuid = { workspace = true }

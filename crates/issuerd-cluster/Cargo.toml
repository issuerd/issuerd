[package]
name = "issuerd-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Distributed cache (Redis) and clustering primitives for the Issuerd IAM server"
keywords = ["redis", "cluster", "iam", "caching"]
categories = ["authentication", "caching"]

[dependencies]
issuerd-core = { workspace = true }
async-trait = { workspace = true }
redis = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
testcontainers = { workspace = true }

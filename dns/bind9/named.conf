options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    // Recursion (and cache answers) only for the compose `test` network and
    // loopback; test.local stays answerable via allow-query.
    allow-recursion { localhost; 172.30.0.0/16; };
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    dnssec-validation no;
};

zone "test.local" {
    type master;
    file "/etc/bind/zones/db.test.local";
};

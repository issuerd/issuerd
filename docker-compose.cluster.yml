# Issuerd multi-node cluster demo stack.
#
# Two Issuerd nodes behind an nginx load balancer, sharing PostgreSQL
# (realms, users, sessions, signing keys) and Redis (auth codes, pending auth,
# revocation blocklist, login-failure counters). No sticky sessions.
#
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d --build
#   curl http://localhost:8088/realms/demo/.well-known/openid-configuration
#   ISSUERD_CLUSTER_E2E=1 cargo test --test integration cluster_e2e
#   docker compose -f docker-compose.cluster.yml down -v
#
# Runs as its own compose project (`issuerd-cluster`) on its own subnet so it
# never collides with the dev/test stack in docker-compose.yml. Per-node ports
# 18081/18082 are exposed for debugging and tests; clients should use the LB.

name: issuerd-cluster

x-issuerd-node: &issuerd-node
  build:
    context: .
    dockerfile: Dockerfile
  image: issuerd:local
  volumes:
    - ./cluster/issuerd.toml:/etc/issuerd/issuerd.toml:ro
    - ./cluster/provision.yaml:/etc/issuerd/provision.yaml:ro
  networks:
    - cluster-net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "issuerd", "healthcheck", "--url", "http://localhost:8080/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: issuerd
      POSTGRES_PASSWORD: issuerd_secret
      POSTGRES_DB: issuerd
    volumes:
      - cluster-postgres-data:/var/lib/postgresql/data
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuerd -d issuerd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Purely ephemeral shared state — no persistence needed. If Redis is wiped,
    # in-flight logins retry; issued tokens and sessions are unaffected (JWTs
    # are self-contained, sessions live in PostgreSQL).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  issuerd-1:
    <<: *issuerd-node
    environment:
      ISSUERD_CLUSTER__NODE_ID: node-1
    ports:
      - "18081:8080"

  issuerd-2:
    <<: *issuerd-node
    environment:
      ISSUERD_CLUSTER__NODE_ID: node-2
    ports:
      - "18082:8080"

  lb:
    image: nginx:alpine
    ports:
      - "8088:8080"
    volumes:
      - ./cluster/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cluster-net
    depends_on:
      issuerd-1:
        condition: service_healthy
      issuerd-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  cluster-net:
    driver: bridge
    ipam:
      config:
        # Deterministic subnet: cluster/issuerd.toml lists it in
        # [proxy].trusted_proxies so X-Forwarded-For from the LB is trusted.
        - subnet: 172.32.0.0/24

volumes:
  cluster-postgres-data:
    driver: local
